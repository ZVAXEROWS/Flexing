server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mediadb}
    username: ${DB_USER:media}
    password: ${DB_PASS:media}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

feature:
  engine:
    host: ${FEATURE_ENGINE_HOST:localhost}
    port: ${FEATURE_ENGINE_PORT:50051}

jwt:
  secret: ${JWT_SECRET:changeme-in-production-use-32chars}
  expiry-seconds: 3600
