syntax = "proto3";

package media.feature;

option java_package = "com.media.feature";
option java_multiple_files = true;

// ─────────────────────────────────────────────────────────
// Service
// ─────────────────────────────────────────────────────────

service FeatureEngine {
  rpc ComputeSimilarity   (SimilarityRequest)   returns (SimilarityResponse);
  rpc BatchUpdate         (BatchUpdateRequest)  returns (BatchUpdateResponse);
  rpc GetFeatureVector    (FeatureVectorRequest) returns (FeatureVectorResponse);
  rpc StreamSimilarities  (stream SimilarityRequest) returns (stream SimilarityResponse);
  rpc Ping                (PingRequest)         returns (PingResponse);
}

// ─────────────────────────────────────────────────────────
// Messages
// ─────────────────────────────────────────────────────────

message SimilarityRequest {
  string           user_id     = 1;
  repeated string  content_ids = 2;
  SimilarityMetric metric      = 3;
  int32            top_k       = 4;
}

message SimilarityResponse {
  string                   user_id        = 1;
  repeated SimilarityScore scores         = 2;
  int64                    computed_at_ms = 3;
}

message SimilarityScore {
  string content_id = 1;
  float  score      = 2;
}

message BatchUpdateRequest {
  repeated InteractionEvent events = 1;
}

message BatchUpdateResponse {
  int32           processed_count = 1;
  int32           failed_count    = 2;
  repeated string errors          = 3;
}

message InteractionEvent {
  string    user_id      = 1;
  string    content_id   = 2;
  EventType type         = 3;
  float     weight       = 4;
  int64     timestamp_ms = 5;
}

message FeatureVectorRequest {
  string content_id = 1;
  int32  dimensions = 2;
}

message FeatureVectorResponse {
  string         content_id = 1;
  repeated float vector     = 2;
  int32          dimensions = 3;
}

message PingRequest {}

message PingResponse {
  string status  = 1;
  string version = 2;
}

// ─────────────────────────────────────────────────────────
// Enums
// ─────────────────────────────────────────────────────────

enum SimilarityMetric {
  COSINE      = 0;
  DOT_PRODUCT = 1;
  EUCLIDEAN   = 2;
}

enum EventType {
  VIEW     = 0;
  CLICK    = 1;
  RATE     = 2;
  COMPLETE = 3;
  SKIP     = 4;
}
